<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Later</title>
<meta name="theme-color" content="#faf8f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme=localStorage.getItem('later.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')</script>
</head>
<body>
<main id="gate" hidden>
  <h1>Later</h1>
  <p class="sub">Connect your data repo to start.</p>
  <form id="gate-form">
    <input id="g-repo" placeholder="username/later-data" autocomplete="off" autocapitalize="off" required>
    <input id="g-token" type="password" placeholder="Paste your GitHub token" autocomplete="off" required>
    <button class="btn" type="submit">Connect</button>
    <p id="g-err" class="err"></p>
  </form>
</main>
<main id="app" hidden>
  <header>
    <div><h1>Later</h1><p id="count" class="sub"></p></div>
    <button id="theme" class="icon" aria-label="Toggle theme"></button>
  </header>
  <form id="add">
    <input id="title" placeholder="Add a task…" autocomplete="off" required>
    <button type="button" id="more" class="link">+ Add details</button>
    <div id="details" hidden>
      <input id="link" type="url" placeholder="Link" autocapitalize="off">
      <textarea id="note" rows="2" placeholder="Note"></textarea>
      <div class="prio" role="group" aria-label="Importance">
        <span class="sub">Importance</span>
        <button type="button" data-p="1">1</button><button type="button" data-p="2">2</button><button type="button" data-p="3">3</button>
      </div>
    </div>
    <button class="btn" type="submit">Add</button>
  </form>
  <nav id="tabs">
    <button data-f="all" class="on">all</button><button data-f="active">active</button><button data-f="done">done</button>
  </nav>
  <div class="center"><button id="clear" class="link">Clear done</button></div>
  <ul id="list"></ul>
  <p id="status" class="sub center"></p>
  <button id="logout" class="link center-block">Disconnect</button>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
